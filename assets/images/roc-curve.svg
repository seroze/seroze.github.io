<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 400" width="470" height="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <!-- area under the curve -->
  <path d="M 70 340 Q 76 250 85 205 Q 92 165 100 145 Q 112 115 130 100 Q 160 75 190 64 Q 235 50 280 46 Q 330 42 370 40 L 370 340 Z"
        fill="#8a8a8a" fill-opacity="0.12" stroke="none"/>

  <!-- axes -->
  <line x1="70" y1="340" x2="370" y2="340" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="70" y1="340" x2="70" y2="40" stroke="#8a8a8a" stroke-width="2"/>

  <!-- ticks -->
  <text x="70" y="360" font-size="12" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="220" y="360" font-size="12" fill="#8a8a8a" text-anchor="middle">0.5</text>
  <text x="370" y="360" font-size="12" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="60" y="345" font-size="12" fill="#8a8a8a" text-anchor="end">0</text>
  <text x="60" y="195" font-size="12" fill="#8a8a8a" text-anchor="end">0.5</text>
  <text x="60" y="45" font-size="12" fill="#8a8a8a" text-anchor="end">1</text>

  <!-- random-guessing diagonal -->
  <line x1="70" y1="340" x2="370" y2="40" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="290" y="150" font-size="13" fill="#8a8a8a" font-style="italic" transform="rotate(-45 290 150)">random guessing, AUC = 0.5</text>

  <!-- the ROC curve -->
  <path d="M 70 340 Q 76 250 85 205 Q 92 165 100 145 Q 112 115 130 100 Q 160 75 190 64 Q 235 50 280 46 Q 330 42 370 40"
        fill="none" stroke="#8a8a8a" stroke-width="3"/>

  <!-- one operating point -->
  <circle cx="130" cy="100" r="5" fill="#8a8a8a"/>
  <text x="145" y="96" font-size="13" fill="#8a8a8a">one threshold</text>
  <text x="145" y="114" font-size="12" fill="#8a8a8a" font-style="italic">FPR 0.2, TPR 0.8</text>

  <!-- AUC label -->
  <text x="200" y="250" font-size="14" fill="#8a8a8a" text-anchor="middle">AUC = this area</text>

  <!-- axis labels -->
  <text x="220" y="385" font-size="14" fill="#8a8a8a" text-anchor="middle">false positive rate</text>
  <text x="24" y="190" font-size="14" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 24 190)">true positive rate</text>

  <!-- corner annotations -->
  <text x="78" y="34" font-size="12" fill="#8a8a8a" font-style="italic">perfect detector lives here</text>
</svg>
