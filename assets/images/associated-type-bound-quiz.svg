<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <!-- question -->
  <text x="25" y="30" font-size="18" font-weight="600" fill="#8a8a8a">How do you write a function bound that requires <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">I</tspan> to be an</text>
  <text x="25" y="56" font-size="18" font-weight="600" fill="#8a8a8a">Iterator whose Item is specifically <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">String</tspan>?</text>

  <!-- option 1 — the correct one -->
  <rect x="25" y="82" width="650" height="46" rx="8" fill="#2f9e63" fill-opacity="0.10" stroke="#2f9e63" stroke-width="1.5"/>
  <circle cx="52" cy="105" r="9" fill="none" stroke="#2f9e63" stroke-width="1.5"/>
  <circle cx="52" cy="105" r="5" fill="#2f9e63"/>
  <text x="78" y="111" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8a8a8a">fn foo&lt;I: Iterator&lt;Item = String&gt;&gt;(iter: I)</text>
  <text x="650" y="111" font-size="14" fill="#2f9e63" text-anchor="end">Correct</text>

  <!-- option 2 -->
  <rect x="25" y="138" width="650" height="46" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-opacity="0.45"/>
  <circle cx="52" cy="161" r="9" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-opacity="0.65"/>
  <text x="78" y="167" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8a8a8a" fill-opacity="0.72">fn foo&lt;I: Iterator&gt;(iter: I&lt;String&gt;)</text>

  <!-- option 3 -->
  <rect x="25" y="194" width="650" height="46" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-opacity="0.45"/>
  <circle cx="52" cy="217" r="9" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-opacity="0.65"/>
  <text x="78" y="223" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8a8a8a" fill-opacity="0.72">fn foo&lt;I: Iterator&lt;String&gt;&gt;(iter: I)</text>

  <!-- option 4 -->
  <rect x="25" y="250" width="650" height="46" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-opacity="0.45"/>
  <circle cx="52" cy="273" r="9" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-opacity="0.65"/>
  <text x="78" y="279" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8a8a8a" fill-opacity="0.72">fn foo(iter: Iterator&lt;String&gt;)</text>

  <!-- explanation -->
  <text x="25" y="332" font-size="14" fill="#8a8a8a"><tspan font-weight="700">That's it.</tspan> Because Item is an associated type (not a generic</text>
  <text x="25" y="354" font-size="14" fill="#8a8a8a">parameter of the trait), you constrain it with the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Item = String</tspan></text>
  <text x="25" y="376" font-size="14" fill="#8a8a8a">syntax rather than passing String positionally.</text>
</svg>
