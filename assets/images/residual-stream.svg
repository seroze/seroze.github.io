<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- the residual stream itself -->
  <line x1="40" y1="130" x2="780" y2="130" stroke="#8a8a8a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="40" y="112" font-size="15" fill="#8a8a8a">embed</text>
  <text x="660" y="112" font-size="15" fill="#8a8a8a">unembed &#8594; logits</text>
  <text x="300" y="160" font-size="16" fill="#8a8a8a" font-style="italic">residual stream (d_model wide)</text>

  <!-- block 1: attention -->
  <rect x="150" y="30" width="140" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="220" y="62" font-size="15" fill="#8a8a8a" text-anchor="middle">attention</text>
  <path d="M 175 130 L 175 82" stroke="#8a8a8a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 265 82 L 265 130" stroke="#8a8a8a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="130" y="106" font-size="13" fill="#8a8a8a" text-anchor="middle">read</text>
  <text x="300" y="106" font-size="13" fill="#8a8a8a" text-anchor="middle">write (+)</text>

  <!-- block 2: mlp -->
  <rect x="420" y="30" width="140" height="52" rx="8" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="490" y="62" font-size="15" fill="#8a8a8a" text-anchor="middle">MLP</text>
  <path d="M 445 130 L 445 82" stroke="#8a8a8a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 535 82 L 535 130" stroke="#8a8a8a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="106" font-size="13" fill="#8a8a8a" text-anchor="middle">read</text>
  <text x="570" y="106" font-size="13" fill="#8a8a8a" text-anchor="middle">write (+)</text>

  <!-- the sum annotation -->
  <circle cx="265" cy="130" r="7" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="260" y1="130" x2="270" y2="130" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="265" y1="125" x2="265" y2="135" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="535" cy="130" r="7" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="530" y1="130" x2="540" y2="130" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="535" y1="125" x2="535" y2="135" stroke="#8a8a8a" stroke-width="2"/>

  <text x="410" y="215" font-size="15" fill="#8a8a8a" text-anchor="middle">every layer adds to the stream; nothing is ever overwritten</text>
</svg>
